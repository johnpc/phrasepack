name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every run deploys its OWN ephemeral sandbox (`sandbox` job), seeds it, runs
# the suite against it, and ALWAYS tears it down (`teardown` job, `if:
# always()`). Nothing is shared between runs and nothing is left standing, so CI
# can't break when a dev sandbox is deleted and there's no idle AWS cost. A
# scheduled sweep (sandbox-cleanup.yml) reaps any `ci-*` sandbox that leaks.
#
# Runs no longer contend for one backend, so the old global serialization is
# gone; we only serialize pushes to the SAME PR (no cancel — a cancelled run
# would still tear down, but finishing is cheaper than redeploying).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

# Every job resolves the SAME sandbox from this identifier; scripts/sandbox.mjs
# sanitizes it (`ci<run_id>`) and derives the deterministic stack name. The
# `ci-` prefix is what the scheduled sweep matches — and the ONLY thing it may
# delete.
env:
  SANDBOX_IDENTIFIER: ci-${{ github.run_id }}

jobs:
  sandbox:
    # Deploy this run's ephemeral backend. A fresh stack each run means the
    # suite always tests against the schema in THIS commit.
    name: Deploy ephemeral sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure AWS "personal" profile
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.aws
          printf '[personal]\naws_access_key_id=%s\naws_secret_access_key=%s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > ~/.aws/credentials
          printf '[profile personal]\nregion=us-west-2\n' > ~/.aws/config
      - name: Deploy the per-run sandbox
        run: npm run sandbox:deploy

  quality:
    name: Lint, Test, Coverage, CRAP & Build
    needs: sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS "personal" profile
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.aws
          printf '[personal]\naws_access_key_id=%s\naws_secret_access_key=%s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > ~/.aws/credentials
          printf '[profile personal]\nregion=us-west-2\n' > ~/.aws/config

      - name: Generate amplify_outputs.json (sandbox)
        run: npm run e2e-config

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: File-length discipline (max 100 lines)
        run: npm run check:lines

      - name: Feature-coverage map
        run: npm run check:features

      - name: Unit tests with coverage (80% floor)
        run: npm run test:coverage

      - name: CRAP score analysis (threshold 15)
        run: npm run crap

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  seed:
    # Acceptance tests run against this run's sandbox, seeded here so every run
    # starts from an identical, bounded state.
    name: Seed sandbox
    needs: sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure AWS "personal" profile
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.aws
          printf '[personal]\naws_access_key_id=%s\naws_secret_access_key=%s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > ~/.aws/credentials
          printf '[profile personal]\nregion=us-west-2\n' > ~/.aws/config
      - name: Generate amplify_outputs.json (sandbox)
        run: npm run e2e-config
      # A fresh sandbox has a brand-new, EMPTY Cognito pool: the editor account
      # the seed signs in as doesn't exist yet. Create it (confirmed, permanent
      # password, in `editors`). The pool id is read from this run's sandbox
      # stack, which must be tagged as a sandbox.
      - name: Create the test/editor user in the sandbox pool
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npm run sandbox:ensure-editor
      - name: Seed the sandbox to a known state
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npm run seed

  acceptance:
    # One job per feature area, each its own independent check. Runs after the
    # sandbox is seeded. Grows a matrix entry per feature area as slices land
    # (check:features enforces that every .feature maps to an area here).
    name: Acceptance Tests (${{ matrix.area.name }})
    needs: seed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        area:
          - name: browse
            paths: .features-gen/e2e/features/browse
          - name: pack
            paths: .features-gen/e2e/features/pack
          - name: generate
            paths: .features-gen/e2e/features/generate
          - name: a11y
            paths: .features-gen/e2e/features/a11y
          - name: offline
            paths: .features-gen/e2e/features/offline
          - name: practice
            paths: .features-gen/e2e/features/practice
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS "personal" profile
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.aws
          printf '[personal]\naws_access_key_id=%s\naws_secret_access_key=%s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > ~/.aws/credentials
          printf '[profile personal]\nregion=us-west-2\n' > ~/.aws/config

      - name: Generate amplify_outputs.json (sandbox)
        run: npm run e2e-config

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run acceptance tests (${{ matrix.area.name }})
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx bddgen && npx playwright test ${{ matrix.area.paths }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ matrix.area.name }}
          path: playwright-report/
          retention-days: 7

  teardown:
    # ALWAYS delete this run's sandbox — on success, failure, or cancellation,
    # on PRs and on main alike. `if: always()` + depending on every job means it
    # runs last, whatever happened. `sandbox:delete` is a no-op when the stack
    # never got created, and FAILS if the stack survives, so a leak is a red
    # job rather than a silent cost. The scheduled sweep is the backstop.
    name: Tear down ephemeral sandbox
    needs: [sandbox, quality, seed, acceptance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure AWS "personal" profile
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.aws
          printf '[personal]\naws_access_key_id=%s\naws_secret_access_key=%s\n' \
            "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > ~/.aws/credentials
          printf '[profile personal]\nregion=us-west-2\n' > ~/.aws/config
      - name: Delete the per-run sandbox
        run: npm run sandbox:delete
